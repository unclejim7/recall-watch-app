services:
  - type: web
    name: recall-watch-app
    env: node
    plan: starter # cheapest plan that supports a persistent disk; free tier can't mount one
    region: oregon
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/data.sqlite
      - key: CRON_SCHEDULE
        value: 0 */6 * * *
      # Required for alert emails to actually send — set these in the Render
      # dashboard after the first deploy (Environment tab). Any SMTP provider
      # works: SendGrid, Postmark, Mailgun, or a Gmail app password.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      # Optional: raises the openFDA rate limit from 40/min to 240/min.
      - key: FDA_API_KEY
        sync: false
      # Optional: instant SMS alerts via Twilio. Leave unset to disable SMS.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Optional: instant web push alerts. Generate a keypair with
      # `npx web-push generate-vapid-keys`. Leave unset to disable push.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
